[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "subflow"
version = "1.0.0"
description = "Subscription management backend for customers, plans and recurring subscriptions."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]


[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]


[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[tool.ruff]
line-length = 120
target-version = "py312"
